<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>事件雷达 · 投资事件情报与证据时间线</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark">◈</div>
    <div>
      <h1>事件雷达</h1>
      <p class="subtitle">投资事件情报与证据时间线</p>
    </div>
  </div>
  <div class="topbar-right">
    <button id="addDocBtn" class="btn btn-sm">+ 提交新文档</button>
    <button id="bellBtn" class="icon-btn" title="通知中心" aria-label="通知中心">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 2a3.8 3.8 0 0 0-3.8 3.8c0 2.5-1.2 4.4-2.2 5.2h12c-1-.8-2.2-2.7-2.2-5.2A3.8 3.8 0 0 0 8 2Z"/>
        <path d="M6.6 13a1.5 1.5 0 0 0 2.8 0"/>
      </svg>
      <span id="unreadBadge" class="badge hidden">0</span>
    </button>
  </div>
</header>

<!-- ============ 首页：事件选择 ============ -->
<main id="homeView">
  <section class="hero">
    <h2>同一事件，看清演化</h2>
    <p class="hero-sub">公告、新闻、研报、传闻多源汇聚 —— 事实 / 观点 / 推测 / 传闻逐条可溯，结论变化实时通知</p>
  </section>
  <section id="eventGrid" class="event-grid"></section>
  <footer class="home-foot">
    <div id="homeStats" class="home-stats"></div>
    <p id="footerDisclaimer" class="disc"></p>
  </footer>
</main>

<!-- ============ 事件详情 ============ -->
<main id="eventView" class="hidden">
  <button id="backBtn" class="back-btn">← 全部事件</button>
  <div id="detail"></div>
</main>

<div id="notifDrawer" class="drawer hidden">
  <div class="drawer-head">
    <span>通知中心</span>
    <button id="closeNotif" class="close-btn">✕</button>
  </div>
  <div id="notifList" class="notif-list"></div>
</div>

<div id="ingestModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <span>提交新文档（在线走主链路：入库 → 抽取 → 合并 → 判定 → 通知）</span>
      <button id="closeIngest" class="close-btn">✕</button>
    </div>
    <label>标题 <input id="ingTitle" type="text" placeholder="如：XX公司关于市场传闻的澄清公告"></label>
    <div class="row2">
      <label>来源类型
        <select id="ingSource">
          <option>公司公告</option><option>官方公告</option><option>权威媒体</option>
          <option>一般媒体</option><option>研报</option><option>互动易</option><option>社交媒体</option>
        </select>
      </label>
      <label>发布方 <input id="ingPublisher" type="text" placeholder="如：巨潮资讯"></label>
    </div>
    <div class="row2">
      <label>披露时间 <input id="ingPublishTime" type="text" placeholder="2026-11-01"></label>
      <label>事件发生时间 <input id="ingEventTime" type="text" placeholder="2026-10-30（可空）"></label>
    </div>
    <label>原文链接 <input id="ingUrl" type="text" placeholder="https://…"></label>
    <label>正文（保留关键原句）
      <textarea id="ingBody" rows="7" placeholder="粘贴公告或新闻正文……"></textarea>
    </label>
    <div class="modal-actions">
      <button id="cancelIngest" class="btn">取消</button>
      <button id="submitIngest" class="btn btn-primary">提交并分析</button>
    </div>
    <div id="ingestResult" class="ingest-result hidden"></div>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
